<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Jornada & Rotina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Elementos 3D Tridimensionais Flutuando ao Fundo -->
  <div class="bg-3d-scene">
    <div class="shape3d sphere sphere-1"></div>
    <div class="shape3d torus torus-1"></div>
    <div class="shape3d pyramid pyramid-1"></div>
    <div class="shape3d sphere sphere-2"></div>
    <div class="shape3d cube cube-1"></div>
    <div class="shape3d torus torus-2"></div>
  </div>

  <!-- Conteúdo Principal -->
  <div class="app-container">
    <header class="header">
      <div class="badge">Planejamento Semanal</div>
      <h1 class="gradient-title">Minha Jornada & Rotina</h1>
      <p class="subtitle">Harmonia, disciplina e constância na sua jornada diária</p>
      
      <!-- Navegação de Dias -->
      <nav class="day-tabs">
        <button class="tab-btn active" onclick="switchDay('segunda', event)">Segunda-feira</button>
        <button class="tab-btn" onclick="switchDay('terca', event)">Terça-feira</button>
        <button class="tab-btn" onclick="switchDay('quarta', event)">Quarta-feira</button>
        <button class="tab-btn" onclick="switchDay('quinta', event)">Quinta-feira</button>
        <button class="tab-btn" onclick="switchDay('sexta', event)">Sexta-feira</button>
      </nav>
    </header>

    <!-- Grid de Cards de Rotina -->
    <main class="cards-grid" id="cardsGrid">
      <!-- Os cards serão injetados dinamicamente via JS -->
    </main>
  </div>

  <!-- Modal com Efeito de Zoom 3D -->
  <div class="modal-overlay" id="routineModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-header">
        <span class="modal-period" id="mPeriod">Manhã</span>
        <h2 id="mTitle" class="gradient-title">Título do Período</h2>
      </div>
      <div class="modal-body">
        <div class="info-tag">⏱️ Horário estimado: <strong id="mTime">07:00 - 12:00</strong></div>
        <p id="mDescription" class="modal-desc">Descrição detalhada...</p>
        
        <h3>Passo a passo da rotina</h3>
        <ul id="mSteps" class="steps-list"></ul>
      </div>
      <div class="modal-footer">
        <button class="btn-close-modal" onclick="closeModal()">Concluído</button>
      </div>
    </div>
  </div>
