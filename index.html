<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotina | Meu Ritmo Diário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Elementos 3D Tridimensionais Flutuando ao Fundo -->
  <div class="bg-3d-scene">
    <div class="shape3d sphere sphere-1"></div>
    <div class="shape3d torus torus-1"></div>
    <div class="shape3d pyramid pyramid-1"></div>
    <div class="shape3d sphere sphere-2"></div>
    <div class="shape3d cube cube-1"></div>
    <div class="shape3d torus torus-2"></div>
  </div>

  <!-- Conteúdo Principal -->
  <div class="app-container">
    <header class="header">
      <div class="badge">Planejamento Semanal</div>
      <h1 class="gradient-title">AuraRoutine</h1>
      <p class="subtitle">Harmonia, disciplina e constância na sua jornada diária</p>
      
      <!-- Navegação de Dias -->
      <nav class="day-tabs">
        <button class="tab-btn active" onclick="switchDay('segunda')">Segunda-feira</button>
        <button class="tab-btn" onclick="switchDay('terca')">Terça-feira</button>
        <button class="tab-btn" onclick="switchDay('quarta')">Quarta-feira</button>
        <button class="tab-btn" onclick="switchDay('quinta')">Quinta-feira</button>
        <button class="tab-btn" onclick="switchDay('sexta')">Sexta-feira</button>
      </nav>
    </header>

    <!-- Grid de Cards de Rotina -->
    <main class="cards-grid" id="cardsGrid">
      <!-- Os cards serão injetados dinamicamente via JS -->
    </main>
  </div>

  <!-- Modal com Efeito de Zoom 3D -->
  <div class="modal-overlay" id="routineModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-header">
        <span class="modal-period" id="mPeriod">Manhã</span>
        <h2 id="mTitle" class="gradient-title">Título do Período</h2>
      </div>
      <div class="modal-body">
        <div class="info-tag">⏱️ Horário estimado: <strong id="mTime">07:00 - 12:00</strong></div>
        <p id="mDescription" class="modal-desc">Descrição detalhada...</p>
        
        <h3>Passo a passo da rotina</h3>
        <ul id="mSteps" class="steps-list"></ul>
      </div>
      <div class="modal-footer">
        <button class="btn-close-modal" onclick="closeModal()">Concluído</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Embutido -->
  <script>
    // Dados da rotina baseados na sua descrição diária
    const routineData = {
      segunda: [
        {
          period: "Manhã",
          title: "Despertar & Escola",
          time: "06:30 - 12:20",
          icon: "☀️",
          summary: "Café da manhã especial com a família e aulas na escola.",
          description: "O dia começa com conexão familiar no café da manhã, seguido de foco e aprendizado na escola.",
          steps: [
            "Acordar e preparar-se para o dia",
            "Tomar café da manhã com a família",
            "Ir para a escola e acompanhar as aulas"
          ]
        },
        {
          period: "Início da Tarde",
          title: "Prática de Teclado",
          time: "13:30 - 15:00",
          icon: "🎹",
          summary: "Desenvolvimento musical e treino no teclado.",
          description: "Sessão dedicada ao treino de escalas, leitura de partitura e repertório musical.",
          steps: [
            "Aquecimento de dedos e exercícios de agilidade",
            "Estudo de músicas do repertório",
            "Prática de percepção e ritmo"
          ]
        },
        {
          period: "Fim da Tarde",
          title: "Bloco de Estudos",
          time: "15:30 - 17:30",
          icon: "📚",
          summary: "2 horas de estudos focados em casa.",
          description: "Momento reservado para aprofundamento das matérias escolares e revisão de conteúdos.",
          steps: [
            "Revisão dos conteúdos vistos na escola",
            "Resolução de exercícios e tarefas",
            "Organização das anotações para o dia seguinte"
          ]
        },
        {
          period: "Noite",
          title: "Treino & Caminhada",
          time: "18:00 - 19:30",
          icon: "👟",
          summary: "Caminhada a pé com amiga e treino na academia.",
          description: "Desconexão e saúde física. Ir a pé conversando com a amiga torna o trajeto agradável antes do treino.",
          steps: [
            "Encontrar a amiga e ir a pé para a academia",
            "Treino de musculação e exercícios físicos",
            "Retorno com sensação de bem-estar e descanso"
          ]
        }
      ],
      terca: [
        {
          period: "Manhã",
          title: "Despertar & Escola",
          time: "06:30 - 12:20",
          icon: "☀️",
          summary: "Rotina matutina padrão: café em família e escola.",
          description: "Mantendo a constância da manhã com a presença da família no café e foco nos estudos escolares.",
          steps: [
            "Acordar e higienização matutina",
            "Café da manhã reunido com a família",
            "Aulas e atividades na escola"
          ]
        },
        {
          period: "Tarde",
          title: "Estudo Avançado & Atividades",
          time: "14:00 - 17:00",
          icon: "📖",
          summary: "Aprofundamento de tarefas e leitura.",
          description: "Período para consolidar aprendizados e adiantar matérias da semana.",
          steps: [
            "Organização da mesa de estudos",
            "Leitura de material complementar",
            "Exercícios fixadores"
          ]
        },
        {
          period: "Noite",
          title: "Descanso & Lazer",
          time: "18:00 - 21:00",
          icon: "🌙",
          summary: "Recuperação de energias e tempo pessoal.",
          description: "Momento para relaxar, escutar música e recarregar para o meio da semana.",
          steps: [
            "Jantar leve",
            "Hobby pessoal / Séries",
            "Preparação para dormir cedo"
          ]
        }
      ],
      quarta: [
        {
          period: "Manhã",
          title: "Despertar & Escola",
          time: "06:30 - 12:20",
          icon: "☀️",
          summary: "Rotina matutina padrão: café em família e escola.",
          description: "Constância é a chave: energia garantida pelo café em família antes das aulas.",
          steps: [
            "Despertar energizado",
            "Café da manhã com a família",
            "Aulas na escola"
          ]
        },
        {
          period: "Tarde",
          title: "Teclado & Foco",
          time: "14:00 - 17:00",
          icon: "🎹",
          summary: "Estudo de música e revisão de conteúdo.",
          description: "Equilíbrio entre arte e estudos teóricos.",
          steps: [
            "Treino instrumental no teclado",
            "Bloco curto de revisão escolar"
          ]
        }
      ],
      quinta: [
        {
          period: "Manhã",
          title: "Despertar & Escola",
          time: "06:30 - 12:20",
          icon: "☀️",
          summary: "Rotina matutina padrão: café em família e escola.",
          description: "Início do dia alinhado com a rotina diária de aprendizado e convivência.",
          steps: [
            "Manhã em família",
            "Presença e estudos na escola"
          ]
        },
        {
          period: "Tarde/Noite",
          title: "Academia & Bem-Estar",
          time: "17:30 - 19:30",
          icon: "🏋️‍♀️",
          summary: "Caminhada e treino físico.",
          description: "Manter o corpo em movimento para descansar a mente.",
          steps: [
            "Caminhada até a academia",
            "Treino do dia",
            "Descanso noturno"
          ]
        }
      ],
      sexta: [
        {
          period: "Manhã",
          title: "Despertar & Escola",
          time: "06:30 - 12:20",
          icon: "☀️",
          summary: "Rotina matutina padrão: café em família e escola.",
          description: "Fechando a semana escolar com chave de ouro e presença familiar.",
          steps: [
            "Café da manhã especial de sexta",
            "Últimas aulas da semana"
          ]
        },
        {
          period: "Tarde",
          title: "Teclado & Finalização",
          time: "14:00 - 16:30",
          icon: "🎵",
          summary: "Prática musical e organização do fim de semana.",
          description: "Finalização das metas semanais.",
          steps: [
            "Prática livre no teclado",
            "Organização da semana seguinte"
          ]
        }
      ]
    };

    let currentDay = 'segunda';

    // Renderizar os Cards da Rotina
    function renderCards(day) {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      
      const items = routineData[day] || [];
      
      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card-3d';
        card.style.animationDelay = `${index * 0.1}s`;
        card.onclick = () => openModal(item);

        card.innerHTML = `
          <div class="card-icon">${item.icon}</div>
          <span class="card-period">${item.period}</span>
          <h3 class="card-title">${item.title}</h3>
          <p class="card-time">⏱️ ${item.time}</p>
          <p class="card-summary">${item.summary}</p>
          <div class="card-action">Ver detalhes ➔</div>
        `;
        
        grid.appendChild(card);
      });
    }

    // Alternar entre os dias
    function switchDay(day) {
      currentDay = day;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderCards(day);
    }

    // Abrir Modal
    function openModal(item) {
      document.getElementById('mPeriod').innerText = item.period;
      document.getElementById('mTitle').innerText = item.title;
      document.getElementById('mTime').innerText = item.time;
      document.getElementById('mDescription').innerText = item.description;

      const stepsList = document.getElementById('mSteps');
      stepsList.innerHTML = '';
      item.steps.forEach(step => {
        const li = document.createElement('li');
        li.innerText = step;
        stepsList.appendChild(li);
      });

      document.getElementById('routineModal').classList.add('active');
    }

    // Fechar Modal
    function closeModal() {
      document.getElementById('routineModal').classList.remove('active');
    }

    // Fechar ao clicar fora do conteúdo
    window.onclick = function(e) {
      const modal = document.getElementById('routineModal');
      if (e.target === modal) {
        closeModal();
      }
    };

    // Inicialização
    renderCards(currentDay);
  </script>
</body>
</html>
